[build]
  publish = "."


[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# Never let a response from the reel API be treated as a document. fileType is
# allowlisted server-side too; this is the second lock on the same door.
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'none'; sandbox"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Everything the site loads is same-origin — htmx is vendored, fonts are
    # self-hosted — with exactly one exception: connect.facebook.net, the Meta
    # pixel. It is here because Meta's own guidance is pixel *and* Conversions
    # API: the server side alone loses fbp/fbc and match quality drops. Nothing
    # else third-party gets in, so rule 6 stays enforced by the browser.
    #
    # 'unsafe-inline' is required and cannot be dropped as things stand: the FAQ
    # calls toggleFaq() from inline onclick and the markup carries inline style
    # attributes, both inherited from the original. Adding a nonce would make
    # the browser *ignore* 'unsafe-inline' and break them, so it is all or
    # nothing — see the security notes in docs/SECURITY.md.
    #
    # media-src allows https: because the reel can be pointed at an external
    # CDN from /admin. Everything else is locked to self.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.facebook.com; font-src 'self'; media-src 'self' https:; connect-src 'self' https://www.facebook.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
